services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: geoclock
      POSTGRES_PASSWORD: geoclock
      POSTGRES_DB: geoclock
    ports: ["127.0.0.1:5432:5432"]   # reachable from this machine only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoclock"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://geoclock:geoclock@db:5432/geoclock
      REDIS_URL: redis://redis:6379/0
      FLASK_APP: wsgi.py
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
